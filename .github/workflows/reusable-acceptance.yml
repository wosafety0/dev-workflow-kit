name: Reusable Acceptance Gate

on:
  workflow_call:
    inputs:
      runtime:
        description: Consumer runtime to provision (python or node)
        required: false
        type: string
        default: "python"
      python-version:
        description: Python version requested by the consuming repository when runtime is python
        required: false
        type: string
        default: "3.12"
      node-version:
        description: Node.js version requested by the consuming repository when runtime is node
        required: false
        type: string
        default: "26"
      test-command:
        description: Explicit test command owned and reviewed by the consuming repository
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out consuming repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate requested runtime
        id: runtime
        shell: bash
        env:
          REQUESTED_RUNTIME: ${{ inputs.runtime }}
        run: |
          case "$REQUESTED_RUNTIME" in
            python|node) echo "Requested runtime is supported." ;;
            *) echo "runtime must be either python or node." >&2; exit 2 ;;
          esac
      - name: Set up Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up Node.js
        if: inputs.runtime == 'node'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Run consumer-owned acceptance command
        id: tests
        continue-on-error: true
        shell: bash
        env:
          ACCEPTANCE_COMMAND: ${{ inputs.test-command }}
        run: |
          if [ -z "${ACCEPTANCE_COMMAND//[[:space:]]/}" ]; then
            echo "test-command must not be empty." >&2
            exit 2
          fi
          bash -euo pipefail -c "$ACCEPTANCE_COMMAND"
      - name: Build redacted consumer acceptance report
        id: report
        if: always()
        shell: bash
        env:
          CONSUMER_COMMIT_SHA: ${{ github.sha }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          outcome = os.environ.get("TEST_OUTCOME", "skipped")
          test_status = {
              "success": "passed",
              "failure": "failed",
              "cancelled": "not_run",
              "skipped": "not_run",
          }.get(outcome, "not_run")
          report = {
              "schema_version": 1,
              "consumer_commit_sha": os.environ["CONSUMER_COMMIT_SHA"],
              "caller_workflow_ref": os.environ["CALLER_WORKFLOW_REF"],
              "caller_workflow_sha": os.environ["CALLER_WORKFLOW_SHA"],
              "tests": {"consumer-acceptance-command": test_status},
              "status": "passed" if test_status == "passed" else "failed",
          }
          output = Path("artifacts/consumer-acceptance-report.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("Redacted consumer acceptance report written.")
          print("Acceptance status: " + report["status"])
          PY
      - name: Upload consumer acceptance report
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consumer-acceptance-report
          path: artifacts/consumer-acceptance-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Fail job unless all required stages succeeded
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          failed=()
          [[ "$TEST_OUTCOME" == "success" ]] || failed+=("tests")
          [[ "$REPORT_OUTCOME" == "success" ]] || failed+=("report")
          [[ "$ARTIFACT_OUTCOME" == "success" ]] || failed+=("artifact")
          if (( ${#failed[@]} > 0 )); then
            printf 'Acceptance gate closed; unsuccessful required stage(s): %s\n' "$(IFS=', '; echo "${failed[*]}")" >&2
            exit 1
          fi
          echo "Acceptance orchestration gate passed."
