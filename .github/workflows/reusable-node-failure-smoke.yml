name: Reusable Node Failure Smoke Test

on:
  pull_request:
    branches: [main, "feat/**", "test/**"]

permissions:
  contents: read

jobs:
  consumer-expected-failure:
    uses: wosafety0/dev-workflow-kit/.github/workflows/reusable-acceptance.yml@65544e290fd875bb6c4e30f6525b238200037bba
    with:
      runtime: "node"
      node-version: "26"
      test-command: "node -e 'process.exit(23)'"
